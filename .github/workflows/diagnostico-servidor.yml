            5bhiLmnNHKYAraWPRFI5yaadP2zHkPVNM+9heuJpLVrgySSk1i9Z3xwsSs7bHQ==
            -----END CERTIFICATE-----
            CERT
            {
              seccion() { printf '\n===== %s =====\n' "$1"; }
              BD=vigiiap_postgres
              psql_en() { docker exec -i "$BD" sh -c 'psql -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-postgres}" -At -F " | "'; }

              seccion "Hora del servidor (UTC)"
              date -u

              seccion "Conexion de GeoServer: campos NO secretos y fechas de cambio"
              echo "SELECT jsonb_object_agg(e.k, e.v)::text FROM conexiones_geoserver c, jsonb_each(to_jsonb(c)) AS e(k,v) WHERE e.k !~* '(pass|clave|secret|cifr|token|key)' GROUP BY c.id;" | psql_en

              seccion "Auditoria reciente que mencione geoserver (24 h)"
              echo "SELECT to_jsonb(a)::text FROM audit_log a WHERE a.created_at > now() - interval '24 hours' AND to_jsonb(a)::text ILIKE '%geoserver%' ORDER BY a.created_at DESC LIMIT 15;" | psql_en

              seccion "Prueba desde el backend: con y sin credenciales"
              docker exec -i vigiiap_backend node --input-type=module <<'JS'
            import { obtenerConexionParaConector } from '/app/src/modules/geovisores/conexionesGeoserver.service.js';
            import * as gs from '/app/src/modules/geovisores/geoserver.connector.js';
            import { query } from '/app/src/config/database.js';
            const { rows } = await query('SELECT id FROM conexiones_geoserver');
            for (const { id } of rows) {
              try {
                const c = await obtenerConexionParaConector(id);
                console.log('conexion', id, '| url usada:', c.url, '| usuario:', c.usuarioLectura, '| largo de la clave:', String(c.passwordDescifrada ?? '').length);
                try { const w = await gs.obtenerCapacidadesWfs(c); console.log('  WFS con credenciales: OK,', w.length, 'capas'); } catch (e) { console.log('  WFS con credenciales:', e.message); }
                try { const r = await gs.obtenerCapacidadesWcs(c); console.log('  WCS con credenciales: OK,', r.length, 'coberturas'); } catch (e) { console.log('  WCS con credenciales:', e.message); }
                const u = new URL(`${c.url}/wfs`);
                u.searchParams.set('service', 'WFS'); u.searchParams.set('version', '2.0.0'); u.searchParams.set('request', 'GetCapabilities');
                const sin = await fetch(u, { signal: AbortSignal.timeout(15000) });
                console.log('  WFS sin credenciales:', sin.status);
              } catch (e) { console.log('conexion', id, 'error:', e.message); }
            }
            process.exit(0);
            JS

              seccion "Registros del backend sobre GeoServer (ultimas 8 h)"
              docker logs --since 8h vigiiap_backend 2>&1 | grep -iE 'geoserver|conexion' | tail -25 | cut -c1-260
            } 2>&1 | openssl smime -encrypt -aes256 -binary -outform PEM "$t"
            rm -f "$t"
