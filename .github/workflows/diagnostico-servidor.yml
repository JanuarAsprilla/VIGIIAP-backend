name: Diagnóstico del servidor 4 (temporal, solo lectura, salida cifrada)

# Flujo TEMPORAL: se borra al terminar. Ejecuta comandos de solo lectura en el servidor y cifra TODA la salida con un
# certificado público antes de imprimirla, porque los registros de este repositorio son públicos. Solo se ejecuta
# para el dueño y únicamente cuando cambia este mismo archivo.
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/diagnostico-servidor.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    name: Diagnóstico cifrado 4
    if: github.actor == 'JanuarAsprilla'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Revisar el inventario de GeoServer y cifrar la salida
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            t=$(mktemp)
            cat > "$t" <<'CERT'
            -----BEGIN CERTIFICATE-----
            MIIDujCCAiICCQC0gxYuH7SZSzANBgkqhkiG9w0BAQsFADAfMR0wGwYDVQQDDBRk
            aWFnbm9zdGljby10ZW1wb3JhbDAeFw0yNjExMjYxNTEwMDRaFw0yNjExMjkxNTEw
            MDRaMB8xHTAbBgNVBAMMFGRpYWdub3N0aWNvLXRlbXBvcmFsMIIBojANBgkqhkiG
