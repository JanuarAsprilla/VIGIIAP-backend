name: Biodiversidad · datos

# Ejecución MANUAL. Ejecuta scripts/biodiversidad/cargar.js dentro del contenedor del backend
# (una transacción, rol aislado) con los mismos secretos que el despliegue.
#
# El archivo de datos NO viaja por GitHub: este repositorio es público y el archivo contiene las
# coordenadas exactas de especies amenazadas. Se sube al servidor por un canal privado (scp) a
# /root/vigiiap/cargas/carga.ndjson.gz antes de ejecutar `cargar` o `cargar-y-activar`.
#   estado            muestra cortes cargados, cruce de conservación y estado de la herramienta
#   cargar            carga los datos sin publicarlos (las coordenadas siguen ocultas)
#   cargar-y-activar  carga y publica los cortes y el cruce de conservación
#   encender|apagar   cambia la fila `biodiversidad` del catálogo de Herramientas

on:
  workflow_dispatch:
    inputs:
      accion:
        description: Qué hacer
        type: choice
        required: true
        default: estado
        options: [estado, cargar, cargar-y-activar, encender, apagar]

permissions:
  contents: read

concurrency:
  group: biodiversidad-datos
  cancel-in-progress: false

jobs:
  ejecutar:
    name: ${{ inputs.accion }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ejecutar en el contenedor del backend
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          ACCION: ${{ inputs.accion }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ACCION
          script_stop: true
          script: |
            set -eu
            CLI="docker exec vigiiap_backend node scripts/biodiversidad/cargar.js"
            ARCHIVO=/root/vigiiap/cargas/carga.ndjson.gz
            limpiar() {
              docker exec -u root vigiiap_backend rm -f /tmp/carga.ndjson.gz || true
            }
            trap limpiar EXIT
            case "$ACCION" in
              estado)  $CLI estado ;;
              encender) $CLI encender ;;
              apagar)  $CLI apagar ;;
              cargar|cargar-y-activar)
                if [ ! -f "$ARCHIVO" ]; then
                  echo "Falta $ARCHIVO: súbalo primero por scp (ver el encabezado de este workflow)."
                  exit 1
                fi
                docker cp "$ARCHIVO" vigiiap_backend:/tmp/carga.ndjson.gz
                docker exec -u root vigiiap_backend chmod 0644 /tmp/carga.ndjson.gz
                if [ "$ACCION" = "cargar-y-activar" ]; then
                  $CLI cargar /tmp/carga.ndjson.gz --activar
                else
                  $CLI cargar /tmp/carga.ndjson.gz
                fi
                # El archivo con coordenadas exactas no se deja en el servidor tras cargarlo.
                rm -f "$ARCHIVO"
                $CLI estado
                ;;
              *) echo "Acción desconocida: $ACCION"; exit 1 ;;
            esac
