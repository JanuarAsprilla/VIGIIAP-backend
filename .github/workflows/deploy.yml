name: Deploy

# Se dispara solo cuando el workflow CI ya terminó (y pasó) sobre main —
# nunca se construye ni despliega una imagen que no pasó lint/tests/docker-build.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build y publicar imagen
    # head_repository check: workflow_run se dispara para CUALQUIER ejecución
    # del workflow CI, incluida la de un PR desde un fork — sin esta guarda,
    # ese fork podría hacer que este job (que sí tiene secrets) se ejecute
    # contra su propio código.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # CRÍTICO: sin esto, checkout usa el ref por defecto del contexto
          # actual (la rama en el momento en que corre ESTE workflow), que
          # puede NO ser el mismo commit exacto que el CI validó — anulando
          # la garantía de "nunca desplegar algo que no paso CI".
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login en GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/januarasprilla/vigiiap-backend:latest
            ghcr.io/januarasprilla/vigiiap-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el servidor
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH y recrear el contenedor con la imagen nueva
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /root/vigiiap
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f
