name: Backup de base de datos

# Respaldo diario de PostgreSQL a Cloudflare R2 (bucket separado, privado).
# Antes de esto no existía ningún backup automatizado -- una falla del VPS
# significaba pérdida total de datos. Reutiliza las credenciales R2 que ya
# viven en el .env del servidor (las mismas que usa la app para archivos),
# no hace falta duplicarlas como secrets de GitHub.
on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC = 02:00 Colombia (UTC-5), horario de bajo tráfico
  workflow_dispatch: {} # permite disparar un respaldo manual para probar/forzar uno

permissions:
  contents: read

jobs:
  backup:
    name: Respaldar PostgreSQL a R2
    runs-on: ubuntu-latest
    steps:
      - name: SSH y ejecutar el respaldo en el servidor
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/vigiiap
            set -a
            source .env.backend
            set +a

            mkdir -p backups
            ARCHIVO="vigiiap_$(date +%F_%H%M).sql.gz"

            # -h 127.0.0.1 (no socket local): fuerza el mismo camino de
            # autenticación por contraseña que ya usa la app (ver
            # src/config/database.js), en vez de depender de las reglas de
            # confianza local del contenedor.
            docker compose exec -T -e PGPASSWORD="$DB_PASSWORD" postgres \
              pg_dump -h 127.0.0.1 -U "$DB_USER" "$DB_NAME" | gzip > "backups/$ARCHIVO"

            # Verificación real, no solo "el comando no falló": un pg_dump
            # que fallara por auth igual podría producir un archivo pequeño
            # que gzip comprime sin quejarse -- se confirma que el contenido
            # es un dump real antes de subirlo.
            if ! gunzip -c "backups/$ARCHIVO" | head -c 4096 | grep -q "PostgreSQL database dump"; then
              echo "El respaldo no tiene la cabecera esperada de pg_dump -- abortando sin subir" >&2
              rm -f "backups/$ARCHIVO"
              exit 1
            fi

            # Este servidor usa MinIO auto-hospedado, no Cloudflare R2 real
            # (R2_ACCOUNT_ID=self-hosted, hay un servicio "minio" en el
            # compose). S3_ENDPOINT en ese caso apunta al nombre de servicio
            # interno (ej. http://minio:9000), no a localhost -- el contenedor
            # de la propia app lo resuelve vía la red de Compose, no vía el
            # puerto publicado al host. Este contenedor descartable necesita
            # unirse a esa misma red para que ese hostname resuelva igual.
            # Si no hay S3_ENDPOINT (R2 real, sin MinIO), no hace falta red
            # especial -- el endpoint es público en internet.
            ENDPOINT="${S3_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}"
            NETWORK_ARG=""
            if [ -n "$S3_ENDPOINT" ]; then
              MINIO_CID=$(docker compose ps -q minio)
              if [ -n "$MINIO_CID" ]; then
                MINIO_NET=$(docker inspect "$MINIO_CID" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
                if [ -n "$MINIO_NET" ]; then
                  NETWORK_ARG="--network $MINIO_NET"
                fi
              fi
            fi

            # Bucket privado separado de vigiiap-files/vigiiap-files-public
            # (esos son de archivos de usuarios, este es solo de respaldos).
            # Creación idempotente -- || true porque ya existe después del
            # primer run y CreateBucket devuelve error si ya es tuyo.
            docker run --rm $NETWORK_ARG \
              -e AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
              -e AWS_DEFAULT_REGION=us-east-1 \
              amazon/aws-cli --endpoint-url "$ENDPOINT" \
              s3 mb "s3://vigiiap-db-backups" || true

            docker run --rm $NETWORK_ARG \
              -e AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
              -e AWS_DEFAULT_REGION=us-east-1 \
              -v "$(pwd)/backups:/backups" \
              amazon/aws-cli --endpoint-url "$ENDPOINT" \
              s3 cp "/backups/$ARCHIVO" "s3://vigiiap-db-backups/$ARCHIVO"

            # Retención local corta -- el respaldo de largo plazo vive en R2,
            # no tiene sentido acumular copias indefinidamente en el disco
            # del propio VPS (el mismo disco que se quiere proteger).
            find backups -name "vigiiap_*.sql.gz" -mtime +3 -delete

            echo "Respaldo completado: $ARCHIVO"
