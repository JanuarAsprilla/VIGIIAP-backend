name: Keep Backend Alive

on:
  schedule:
    # Cada 10 minutos — Render free tier duerme después de 15 min de inactividad
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Mínimo privilegio: ningún job de este workflow necesita escribir en el repo.
permissions:
  contents: read

jobs:
  ping:
    name: Ping healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          # Render free tier puede tardar bastante más de 30s en despertar desde
          # frío — un solo intento corto genera falsos negativos en este workflow
          # (no bloquea nada, solo mantiene el servicio despierto). Dos intentos
          # con --max-time generoso distinguen eso de una caída real.
          ping_once() {
            curl -s -o /dev/null -w "%{http_code}" --max-time 55 \
              https://vigiiap-backend.onrender.com/health
          }

          STATUS=$(ping_once) || STATUS="000"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Primer intento: HTTP $STATUS — reintentando en 10s..."
            sleep 10
            STATUS=$(ping_once) || STATUS="000"
          fi

          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Unexpected status: $STATUS"
            exit 1
          fi
          echo "Backend alive (cold start accepted on 503)"
