name: Biodiversidad · fotos por especie (automático)

# Refresca cada mes la foto representativa de las especies de los grupos agregados (aves, insectos, plantas)
# para que no queden desactualizadas. También se puede lanzar a mano.
#
# Aislamiento: la API de consulta nunca sale a internet. El buscador (scripts/biodiversidad/buscar_fotos_especies.mjs)
# corre en un contenedor desechable creado con la imagen del backend pero SIN credenciales de base de datos
# ni acceso a ella; solo habla con la API pública de Vigía y con GBIF. Su resultado (fotos públicas, sin coordenadas)
# lo carga cargar_fotos_especies.js con el rol aislado `biodiversidad_ingesta`.
# Si GBIF falla o una especie ya no tiene foto, se conserva la anterior: el cargador nunca borra.

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biodiversidad-datos
  cancel-in-progress: false

jobs:
  fotos:
    name: Refrescar fotos por especie
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Buscar y cargar en el servidor
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 170m
          script_stop: true
          script: |
            set -eu
            DIR=/root/vigiiap/cargas/auto
            mkdir -p "$DIR"
            rm -f "$DIR/fotos.ndjson" "$DIR/fotos.ndjson.parcial"
            limpiar() {
              rm -rf "$DIR"
              docker exec -u root vigiiap_backend rm -f /tmp/fotos.ndjson || true
            }
            trap limpiar EXIT
            IMAGEN=$(docker inspect vigiiap_backend --format '{{.Config.Image}}')
            # Contenedor desechable: sin variables de entorno del backend, sin red hacia la base de datos.
            docker run --rm --user root --entrypoint node -v "$DIR":/salida "$IMAGEN" \
              scripts/biodiversidad/buscar_fotos_especies.mjs --salida /salida/fotos.ndjson --concurrencia 8
            docker cp "$DIR/fotos.ndjson" vigiiap_backend:/tmp/fotos.ndjson
            docker exec -u root vigiiap_backend chmod 0644 /tmp/fotos.ndjson
            docker exec vigiiap_backend node scripts/biodiversidad/cargar_fotos_especies.js /tmp/fotos.ndjson
