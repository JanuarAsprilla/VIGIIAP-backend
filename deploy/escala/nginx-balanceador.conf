# EJEMPLO de balanceador para VIGIIAP-backend (se monta como /etc/nginx/conf.d/default.conf). No se aplica a ningún
# servidor. Los valores son punto de partida: calibrarlos con una prueba de carga en un entorno aparte.

# Una zona por IP para el límite de conexiones simultáneas y otra para el ritmo de peticiones. El límite de tasa
# real de la aplicación (rateLimiter.js) sigue mandando; esto solo corta abusos groseros antes de llegar a Node.
limit_conn_zone $binary_remote_addr zone=por_ip_conn:10m;
limit_req_zone  $binary_remote_addr zone=por_ip_req:10m rate=50r/s;

# Esquema real para la aplicación: el que informa el borde (CDN o terminador TLS) y, si no hay, el de esta conexión.
map $http_x_forwarded_proto $proto_efectivo {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream backend_vigiiap {
    # Reparte a la réplica con menos conexiones activas: mejor que round-robin cuando hay peticiones lentas
    # (exportaciones, descargas) mezcladas con otras muy cortas.
    least_conn;
    # Docker resuelve `app` a la IP de cada réplica al cargar la configuración (recargar tras escalar).
    server app:4000 max_fails=3 fail_timeout=10s;
    # Conexiones persistentes hacia las réplicas: evita abrir un socket por petición.
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Si hay un CDN delante (Cloudflare u otro), tomar la IP real de su cabecera SOLO de sus rangos publicados.
# Sin esto, la aplicación vería la IP del CDN y el limitador de tráfico trataría a todos los visitantes como uno.
# Rangos de Cloudflare: https://www.cloudflare.com/ips-v4 y https://www.cloudflare.com/ips-v6 (revisar al día).
# set_real_ip_from 173.245.48.0/20;     # ... un set_real_ip_from por cada rango
# real_ip_header   CF-Connecting-IP;
# real_ip_recursive off;

server {
    listen 80;
    server_name _;

    # Cabeceras que la aplicación espera con `app.set('trust proxy', 1)` (un solo salto de confianza):
    #  - X-Forwarded-For se SOBRESCRIBE con la IP del cliente ya verificada ($remote_addr, que con real_ip es la
    #    del CDN-cliente). Nunca $proxy_add_x_forwarded_for: añadiría una IP falsificable del cliente a la cadena
    #    y `req.ip` (clave del limitador y de la analítica) tomaría un valor controlado por el atacante o la del CDN.
    #  - X-Forwarded-Proto lo fija el borde (TLS) o, si este nginx termina TLS, $scheme.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $proto_efectivo;
    proxy_set_header X-Request-Id      $request_id;
    # Necesario para el keepalive hacia el upstream.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Plazos: conexión corta (una réplica caída debe fallar rápido y pasar a otra) y lectura holgada para
    # exportaciones y descargas por stream.
    proxy_connect_timeout 3s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;
    send_timeout          60s;
    client_header_timeout 15s;
    client_body_timeout   30s;
    keepalive_timeout     65s;

    # Igualar al mayor límite de subida de la aplicación (multer, vídeos de fichas). El 413 sale aquí, no en Node.
    client_max_body_size 200m;

    # Reintentar en otra réplica solo ante errores de conexión y respuestas 502/503/504 de peticiones idempotentes.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    # Límite de conexiones simultáneas por IP. Una oficina o un campus comparten IP (NAT): 100 deja margen de sobra
    # a una SPA que abre varias conexiones por persona. Ajustar con datos reales.
    limit_conn por_ip_conn 100;
    limit_conn_status 429;
    limit_req  zone=por_ip_req burst=200 nodelay;
    limit_req_status 429;

    # Balanceo de carga: lo consulta el sistema, no una persona. Sin límites ni registro.
    location = /nginx-estado {
        access_log off;
        return 200 "ok\n";
    }

    # Readiness real de la aplicación (BD y Redis). Para el healthcheck del balanceador externo o del orquestador.
    location = /health/ready {
        access_log off;
        limit_req zone=por_ip_req burst=1000 nodelay;
        limit_conn por_ip_conn 1000;
        proxy_pass http://backend_vigiiap;
    }

    # Streams largos (descargas desde almacenamiento): sin búfer a disco; si el cliente corta, se cierra el origen.
    location ~ ^/api(/v1)?/descargar/ {
        proxy_buffering off;
        proxy_pass http://backend_vigiiap;
    }

    location / {
        proxy_pass http://backend_vigiiap;
    }
}
